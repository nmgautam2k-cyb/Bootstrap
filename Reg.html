<!doctype html>
<html>
  <head>
    <title>Login_Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: url("bg_image.jpg");
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <div
      class="container form-check mt-5 align-content-center border border-2 border-dark bg-white rounded p-4 w-50 h-50"
      id="container"
    >
      <h1 style="text-align: center" class="text-dark mt-4">
        Registration Form
      </h1>
      <div class="row">
        <form>
          <label for="name" class="form-label text-dark mt-3 mb-3">Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            class="form-control bg-dark"
          />

          <label for="email" class="form-label text-dark mt-2">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Ticketbooking@gmail.com"
            class="form-control bg-dark"
          />

          <label for="age" class="form-label text-dark mt-2">Age</label>
          <input
            type="number"
            id="age"
            class="form-control text-white bg-dark"
            placeholder="Enter your Age"
            min="18"
            max="100"
          />

          <label for="number" class="form-label text-dark mt-2">Number</label>
          <input
            type="tel"
            id="number"
            class="form-control text-white bg-dark"
            placeholder="Enter your Mobile Number"
            maxlength="10"
          />
          <div class="gap-2">
            <label class="form-label mt-2" for="otpCode">Verification code</label>
            <div class="otp" data-bs-otp>
              <input
                type="text"
                class="otp-input bg-dark rounded"
                id="otpCode"
                maxlength="6"
                aria-describedby="otpHelp"
                placeholder="Enter Code"
              />
            </div>
            <div id="otpHelp" class="form-text">
              Enter the 6-digit code
            </div>
          </div>
          <div class="check" style="display: flex">
            <label for="status" class="form-label mt-3">Status</label>
            <div class="form-check">
              <input
                type="radio"
                class="form-check-input bg-dark"
                id="single"
                style="margin-top: 20px; margin-left: 20px"
                name="status"
              />
              <label
                for="single"
                name="status"
                class="form-label"
                style="margin-top: 15px; margin-left: 20px"
                >Single</label
              >
            </div>

            <div class="form-check">
              <input
                type="radio"
                class="form-check-input bg-dark"
                id="married"
                name="status"
                style="margin-top: 20px; margin-left: 20px"
              />
              <label
                for="married"
                name="status"
                form-label
                style="margin-top: 15px; margin-left: 20px"
                >Married</label
              >
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
