<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: url("bg_image.jpg");
        background-size: cover;
      }
      #container {
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
      }
    </style>
  </head>
  <body>
    <div
      class="container border border-2 border-dark bg-white rounded p-4 w-25"
      id="container"
    >
      <h1 class="text-center text-dark mt-3 mb-4">Login Form</h1>
      <form action="/" method="POST">
        <div class="mt-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"
              ><img src="Email.svg" alt="Email"
            /></span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ticketbooking@gmail.com"
              class="form-control bg-dark text-white"
              required
            />
          </div>
        </div>
        <div class="mt-3">
          <label for="pass" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"
              ><img src="Key.svg" alt="Password"
            /></span>
            <input
              type="password"
              id="pass"
              name="password"
              class="form-control bg-dark text-white"
              placeholder="Enter password"
              required
            />
          </div>
        </div>
        <div class="text-center mt-2">
          <p>
            I dont have an account!
            <a href="Reg.html" class="text-decoration-none text-primary"
              >Register</a
            >
          </p>
        </div>
        <div class="d-flex justify-content-center mt-3">
          <button type="submit" class="btn btn-dark">submit</button>
        </div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
