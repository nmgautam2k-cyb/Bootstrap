<!doctype html>
<html lang="en">
  <head>
    <title>Registration Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: url("bg_image.jpg") center center / cover fixed;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div
      class="container mt-5 border border-2 border-dark bg-white rounded p-4 w-50 h-25 "
      id="container"
    >
      <h1 class="text-center text-dark mt-3 mb-4">Registration Form</h1>
      <form action="/" method="POST">
        <div class="row row-col-12">
          <div class="col-12 col-md-6">
            <label for="name" class="form-label">Name</label>
            <div class="input-group">
              <span class="input-group-text"
                ><img src="user.svg" alt="User"
              /></span>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your Firstname"
                class="form-control bg-dark text-white"
                required
              />
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="lastName" class="form-label">Last Name</label>
            <div class="input-group">
              <span class="input-group-text"
                ><img src="user.svg" alt="User"
              /></span>
              <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Enter your last name"
                class="form-control bg-dark text-white"
                required
              />
            </div>
          </div>
        </div>
        <div class="row row-col-12">
          <div class="col">
            <div class="mt-3">
              <label for="email" class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><img src="Email.svg" alt="Email"
                /></span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Ticketbooking@gmail.com"
                  class="form-control bg-dark text-white"
                  required
                />
              </div>
            </div>
          </div>
          <div class="col">
            <div class="mt-3">
              <label for="age" class="form-label">Age</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><img src="Age.svg" alt="Age"
                /></span>
                <input
                  type="number"
                  id="age"
                  name="age"
                  class="form-control bg-dark text-white"
                  placeholder="Enter your age"
                  min="18"
                  max="100"
                  required
                />
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <div class="mt-3">
              <label for="pass" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><img src="Key.svg" alt="Password"
                /></span>
                <input
                  type="password"
                  id="pass"
                  name="password"
                  class="form-control bg-dark text-white"
                  placeholder="Enter password"
                  required
                />
              </div>
            </div>
          </div>
          <div class="col">
            <div class="mt-3">
              <label for="number" class="form-label">Mobile Number</label>
              <div class="input-group">
              <span class="input-group-text"><img src="Mobile.svg"></span>
              <input
                type="tel"
                id="number"
                name="mobile"
                class="form-control bg-dark text-white"
                placeholder="Enter your mobile number"
                maxlength="10"
                required
              />
              </div>
              
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <div class="mt-3">
              <label for="otp" class="form-label">Verification Code</label>
              <input
                type="text"
                id="otp"
                name="otp"
                class="form-control otp-input bg-dark text-white"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="Enter 6-digit code"
                aria-describedby="otp"
                required
              />
              <div id="otp" class="form-text">Enter 6 digit code</div>
            </div>
          </div>

          <div class="col">
            <div class="mt-3">
          <label for="pref" class="form-label">Movie preference</label>
          <select
            class="form-select bg-dark text-white"
            id="pref"
            name="moviePreference"
          >
            <option value="Action">Action</option>
            <option value="Drama" selected>Drama</option>
            <option value="Thriller">Thriller</option>
          </select>
        </div>

          </div>
        </div>

        <label class="form-label mt-3">Status</label>
        <div id="status-cont">

          <div class="form-check">
            <input
              type="radio"
              class="form-check-input bg-dark"
              id="male"
              name="status"
              value="Male"
            />
            <label class="form-check-label" for="male">Male</label>
          </div>
          <div class="form-check">
            <input
              type="radio"
              class="form-check-input bg-dark"
              id="female"
              name="status"
              value="Female"
            />
            <label class="form-check-label" for="female">Female</label>
          </div>
        </div>
        <div class="text-center mt-2">
          <p>
            I already have an account!
            <a href="Login.html" class="text-decoration-none text-primary"
              >Login</a
            >
          </p>
        </div>
        <div class="d-flex justify-content-center mt-3">
          <button type="submit" class="btn btn-dark">submit</button>
        </div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
